name: Build & push CI images

on:
  push:
    branches: [main]
    paths:
      - docker/ci-base.Dockerfile
      - docker/retain-typescript-custody.py
      - scripts/verify-typescript-custody.py
      - docker/ci.Dockerfile
      - .github/workflows/build-images.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push images (false = dry-run build only)
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  CI_BASE_IMAGE: ghcr.io/brefwiz/ci-base
  CI_IMAGE: ghcr.io/brefwiz/ci

# One publish at a time: two runs interleaving per-arch pushes and the manifest
# step could assemble an index from different builds.
concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  # Per-arch native builds. QEMU emulation of arm64 is unviable here:
  # ci.Dockerfile compiles ~10 cargo tools from source (cargo-llvm-cov,
  # sccache, sqlx-cli, …); emulated arm64 cargo-install of that set
  # exceeds the 6h job timeout (see run 25073269858).
  build-images:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ── ci-base ──────────────────────────────────────────────────────────────

      - name: Build and push ci-base (${{ matrix.arch }})
        id: build-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci-base.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ env.CI_BASE_IMAGE }}:sha-${{ steps.sha.outputs.short }}-${{ matrix.arch }}
            ${{ env.CI_BASE_IMAGE }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=ci-base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-base-${{ matrix.arch }}

      # ── ci (extends the ci-base just pushed for this arch) ──────────────────

      - name: Build and push ci (${{ matrix.arch }})
        id: build-ci
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CI_BASE_TAG=sha-${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ env.CI_IMAGE }}:sha-${{ steps.sha.outputs.short }}-${{ matrix.arch }}
            ${{ env.CI_IMAGE }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}

      # The digests this run pushed, handed to the manifest job so the index is
      # built from these exact images, never from a mutable per-arch tag.
      - name: Record pushed digests
        if: github.event_name != 'workflow_dispatch' || inputs.push
        run: |
          mkdir -p digests
          echo "${{ steps.build-base.outputs.digest }}" > "digests/ci-base-${{ matrix.arch }}"
          echo "${{ steps.build-ci.outputs.digest }}" > "digests/ci-${{ matrix.arch }}"

      - name: Upload digests
        if: github.event_name != 'workflow_dispatch' || inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  # Stitch per-arch images into a single multi-arch manifest under the
  # canonical tags (latest, sha-<short>). `latest` moves only after the index
  # built under the immutable sha tag is verified to carry one image per arch.
  manifest:
    name: Multi-arch manifest
    needs: build-images
    if: github.event_name != 'workflow_dispatch' || inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Create and verify multi-arch manifests
        env:
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          set -euo pipefail
          short=$(echo ${{ github.sha }} | cut -c1-7)
          for name in ci-base ci; do
            image="$REGISTRY/brefwiz/$name"
            amd64=$(cat "digests/$name-amd64")
            arm64=$(cat "digests/$name-arm64")
            [ -n "$amd64" ] && [ -n "$arm64" ] || { echo "::error::missing per-arch digest for $name"; exit 1; }
            docker buildx imagetools create \
              -t "${image}:sha-${short}" \
              "${image}@${amd64}" \
              "${image}@${arm64}"
            docker buildx imagetools inspect --raw "${image}:sha-${short}" > index.json
            python3 scripts/assert-index-platforms.py linux/amd64,linux/arm64 index.json
            if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
              docker buildx imagetools create -t "${image}:latest" "${image}:sha-${short}"
            fi
          done
