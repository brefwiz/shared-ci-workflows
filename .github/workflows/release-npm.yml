name: Release npm package(s) (reusable)

# Publishes one or more npm packages to GitHub Packages and optionally
# mirrors to npmjs.com and/or the private Gitea registry.  Called by
# downstream repos on tag push.
#
# Usage:
#
#   on:
#     push:
#       tags: ['v*']
#
#   jobs:
#     publish-npm:
#       uses: brefwiz/shared-ci-workflows/.github/workflows/release-npm.yml@main
#       with:
#         packages: "api-bones-axios"
#       permissions:
#         contents: read
#         packages: write

on:
  workflow_call:
    inputs:
      packages:
        description: >
          Space-separated list of package directory names (relative to repo
          root) to publish.  Example: "api-bones-axios"
        type: string
        required: true
      node-version:
        description: Node.js version to use
        type: string
        default: "22"
      mirror-npmjs:
        description: >
          Also publish to npmjs.com.  Requires the npm-token secret.
        type: boolean
        default: false
      mirror-gitea:
        description: >
          Also publish to the private Gitea registry.  Requires the
          gitea-token secret.

          Needed whenever a package under the @brefwiz scope is consumed by a
          repo that resolves that scope from Gitea.  npm routes per SCOPE, not
          per package, so a consumer cannot draw @brefwiz/core-ui from Gitea
          and @brefwiz/api-bones-connect from GitHub Packages — it resolves the
          whole scope from one registry.  A package published to only one of
          them is therefore unreachable from consumers pointed at the other,
          and the failure surfaces as a bare 404 that reads like the package
          does not exist.
        type: boolean
        default: false
    secrets:
      npm-token:
        description: npmjs.com token (required only when mirror-npmjs is true)
        required: false
      gitea-token:
        description: >
          Gitea packages write token (required only when mirror-gitea is true)
        required: false

jobs:
  publish-npm:
    name: Publish npm package(s)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@brefwiz"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for PKG_DIR in ${{ inputs.packages }}; do
            echo "==> Building and publishing ${PKG_DIR}"
            cd "${PKG_DIR}"
            npm ci
            npm run build
            # Ensure publishConfig points to GitHub Packages
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
              pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            npm publish --access public
            cd ..
          done

      - name: Mirror to npmjs.com
        if: ${{ inputs.mirror-npmjs }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          # Switch auth to npmjs.com for the mirror publish
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          for PKG_DIR in ${{ inputs.packages }}; do
            echo "==> Mirroring ${PKG_DIR} to npmjs.com"
            cd "${PKG_DIR}"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
              pkg.publishConfig = { registry: 'https://registry.npmjs.org' };
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            npm publish --access public
            cd ..
          done

      - name: Mirror to Gitea
        if: ${{ inputs.mirror-gitea }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.gitea-token }}
          # Same registry constant as ci-workflows' cilib/npm_registry.py.
          GITEA_REGISTRY: https://git.brefwiz.com/api/packages/brefwiz/npm/
        run: |
          # Without pipefail the `npm publish | tee` below reports tee's status,
          # so a failed publish would look successful and the conflict branch
          # would never run.
          set -o pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::mirror-gitea is enabled but the gitea-token secret is empty"
            exit 1
          fi
          echo "//git.brefwiz.com/api/packages/brefwiz/npm/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          for PKG_DIR in ${{ inputs.packages }}; do
            echo "==> Mirroring ${PKG_DIR} to Gitea"
            cd "${PKG_DIR}"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
              pkg.publishConfig = { registry: process.env.GITEA_REGISTRY };
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            # Republishing an existing version is the normal case when back-
            # filling a package that only ever reached GitHub Packages, so a
            # duplicate must not fail the release.
            if npm publish --access public 2>&1 | tee /tmp/gitea-publish.log; then
              echo "published ${PKG_DIR} to Gitea"
            elif grep -qiE "already exists|EPUBLISHCONFLICT|409" /tmp/gitea-publish.log; then
              echo "${PKG_DIR} already present on Gitea at this version — nothing to do"
            else
              echo "::error::failed to mirror ${PKG_DIR} to Gitea"
              exit 1
            fi
            cd ..
          done
